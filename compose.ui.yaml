services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.browser
    init: true
    environment:
      DATABASE_URL: postgres://aidtrace@db:5432/postgres
      APP_ORIGIN: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
      UI_TEST_CONTAINER: "true"
    volumes:
      - ${AIDTRACE_UI_SOURCE:?Use scripts/aidtrace ui-check}:/workspace
      - node_modules:/workspace/node_modules:ro
      - ui_next_build:/workspace/.next
    networks:
      database:
        aliases: [model]
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, scripts/run-ui-check.mjs]
volumes:
  ui_next_build:
