name: ${AIDTRACE_COMPOSE_PROJECT:-aidtrace-judge}
services:
  db:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_USER: aidtrace
      POSTGRES_DB: aidtrace
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aidtrace -d aidtrace"]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    build: .
    init: true
    mem_limit: 3g
    cpus: 2
    env_file:
      - path: ./local/.env
        required: false
    environment:
      DATABASE_URL: postgres://aidtrace@db:5432/aidtrace
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - next_build:/workspace/.next
      - pnpm_store:/pnpm/store
    ports:
      - "127.0.0.1:3100:3000"
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
    command: [pnpm, dev, --hostname, 0.0.0.0]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  # IAC-379 step 3a: opt-in donation sweep. Plain `docker compose up` does not start it: it needs --profile donations.
  # Judge and release sessions are keyless and create no orders, so they never run it.
  donation-worker:
    profiles: [donations]
    build: .
    init: true
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
    env_file:
      - path: ./local/.env
        required: false
    environment:
      DATABASE_URL: postgres://aidtrace@db:5432/aidtrace
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store
    networks: [default, database]
    depends_on:
      db:
        condition: service_healthy
    command: [pnpm, exec, tsx, scripts/donation-sweep.ts, --loop]
volumes:
  postgres_data:
  node_modules:
  next_build:
  pnpm_store:
networks:
  database:
    internal: true
