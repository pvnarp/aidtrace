services:
  verify:
    build: .
    init: true
    environment:
      DATABASE_URL: postgres://aidtrace@db:5432/postgres
      RECOVERY_CONTAINER: "true"
      RECOVERY_AI: "true"
      APP_ORIGIN: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - next_build:/workspace/.next
      - ./local/verification:/evidence
    networks: [database, inference]
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, node_modules/tsx/dist/cli.mjs, scripts/recovery-ai-smoke.ts, real]
networks:
  inference:
    external: true
    name: ${AIDTRACE_AI_PROJECT:-aidtrace-judge-ai}_inference
